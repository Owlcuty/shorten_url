version: '3.8'

services:
  # 1. PostgreSQL
  postgres_db:
    image: postgres:16-alpine
    container_name: shorty_postgres
    environment:
      POSTGRES_USER: shorty_user
      POSTGRES_PASSWORD: shorty_pass
      POSTGRES_DB: shorty_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 2. Redis
  redis_cache:
    image: redis:7-alpine
    container_name: shorty_redis
    ports:
      - "6379:6379"

  # 3. Go
  shorty_app:
    image: shorty:test # kkaidanov/shorty:latest
    container_name: shorty_main
    ports:
      - "8000:8000"
    volumes:
      - ./config.docker.json:/app/config.json 
    depends_on:
      - postgres_db
      - redis_cache

volumes:
  postgres_data:
